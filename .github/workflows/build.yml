name: Compiler Pilule

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet Xcode
        run: xcodegen generate

      - name: Compiler l'app (sans signature)
        run: |
          xcodebuild \
            -project Pilule.xcodeproj \
            -scheme Pilule \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Creer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pilule.app Payload/
          zip -qry Pilule.ipa Payload

      - name: Mettre l'app a disposition
        uses: actions/upload-artifact@v4
        with:
          name: Pilule-ipa
          path: Pilule.ipa
